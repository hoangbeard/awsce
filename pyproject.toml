[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "awsce"
version = "0.1.0"
description = "A command-line tool to check, summarize and analyze your AWS costs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pham Huy Hoang (HoangBeard)" }]
requires-python = ">=3.10"
keywords = ["aws", "cost-explorer", "finops", "cli", "cost-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "boto3>=1.35",
    "jinja2>=3.1.4",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/hoangbeard/awsce"
Issues = "https://github.com/hoangbeard/awsce/issues"
Changelog = "https://github.com/hoangbeard/awsce/blob/main/CHANGELOG.md"

[project.scripts]
awsce = "awsce.cli:app"

[tool.hatch.build.targets.sdist]
include = ["src/awsce", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/awsce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=awsce --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # Typer uses function calls in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
